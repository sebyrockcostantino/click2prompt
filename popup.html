<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Click2Prompt</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 300px; }
    .wrap { padding: 18px; max-width: none; }
    .head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .name { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .steps { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
    .steps b { color: var(--text); }
    button { width: 100%; margin-bottom: 8px; }
    .state { font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="dot"></span><span class="name">Click2Prompt</span></div>
  <div class="state" id="state">…</div>
  <p class="steps">Click destro su un'immagine → <b>“prompt di questa immagine”</b>.<br>Oppure cattura un'area qualsiasi.</p>
  <button class="primary" id="area">Cattura un'area (Alt+Shift+S)</button>
  <button id="opts">Impostazioni</button>
  <p class="credit" style="margin-top:12px">di <b>SebyRock</b></p>
</div>
<script src="popup.js"></script>
</body>
</html>
